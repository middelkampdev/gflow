version: 2
updates:
  # Every action is pinned to a commit SHA; Dependabot moves the pin and its
  # version comment when a new release appears.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]
